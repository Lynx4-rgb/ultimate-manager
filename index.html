<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111415">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ultimate Manager">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Ultimate Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: floodlit night-match — one dark stadium palette, chalk-white type, amber floodlight accent; hub = header + tab rail + panels; match = scoreboard over aerial pitch */
:root{
 color-scheme:dark;
 --night:#0d1719;--stand:#132226;--panel:#18292e;--panel2:#1e3238;--line:#2b444a;
 --chalk:#e9f0ea;--muted:#8ea6a2;--dim:#5f7774;
 --amber:#f3b23a;--amber-ink:#2a1c03;
 --good:#5fcf8a;--bad:#ef6a5b;--mid:#d8c25a;
 --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
 --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
 --data:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
}
html,body{background:var(--night);color:var(--chalk);min-height:100vh}
body{font-family:var(--body);font-size:15px;line-height:1.45;padding:0 16px;min-height:100%;
 background:radial-gradient(1200px 500px at 50% -200px,#1d3a3c 0%,transparent 70%),var(--night)}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1}
.eyebrow{font-family:var(--data);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;font-family:var(--data)}
.btn{border:1px solid var(--line);background:var(--panel2);padding:9px 16px;border-radius:6px;font-weight:600;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.primary:hover{background:#ffc552}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.badge{display:inline-grid;place-items:center;border-radius:50%;font-family:var(--display);font-weight:900;flex:none;letter-spacing:.02em}
.stars{color:var(--amber);letter-spacing:2px;font-size:13px}
.stars i{color:var(--dim);font-style:normal}

/* ---- select screen ---- */
.intro{display:grid;gap:10px;margin-bottom:22px}
.intro h1{font-size:clamp(44px,8vw,86px);font-weight:900;text-transform:uppercase;line-height:.88}
.intro h1 span{color:var(--amber)}
.intro p{color:var(--muted);max-width:60ch;margin:0}
.clubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.club{position:relative;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:16px;display:grid;gap:12px;overflow:hidden}
.club::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c1)}
.club:hover{border-color:var(--muted)}
.club.sel{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.club .top{display:flex;gap:12px;align-items:center}
.club h3{font-size:24px}
.club .meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.club .meta b{color:var(--chalk);font-family:var(--data);font-size:15px}
.preview{margin-top:18px;border:1px solid var(--line);background:var(--stand);border-radius:10px;padding:18px;display:grid;gap:14px}
.preview .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between}

/* ---- hub ---- */
.hubhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.hubhead h1{font-size:clamp(30px,5vw,46px);text-transform:uppercase}
.hubhead .grow{flex:1;min-width:180px}
.kpis{display:flex;gap:20px;flex-wrap:wrap}
.kpi{display:grid}
.kpi b{font-family:var(--data);font-size:20px;font-weight:700}
.tabs{display:flex;gap:4px;margin:14px 0 18px;overflow-x:auto}
.tab{border:0;background:transparent;padding:10px 14px;font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--chalk);border-color:var(--amber)}
.panel{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:18px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.stack{display:grid;gap:16px;align-content:start}

.fixture{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:8px 0}
.fixture .side{display:flex;align-items:center;gap:10px;min-width:0}
.fixture .side.r{justify-content:flex-end;text-align:right}
.fixture .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fixture .sc{font-family:var(--display);font-weight:800;font-size:22px;min-width:64px;text-align:center}
.fixture.me .nm{color:var(--amber)}
.bigfix{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center;padding:12px 0 18px}
.bigfix .t{display:grid;justify-items:center;gap:8px}
.bigfix .t h3{font-size:clamp(20px,3.4vw,30px)}
.bigfix .vs{font-family:var(--display);font-size:28px;color:var(--dim);font-weight:800}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.list{display:grid}
.list > *+*{border-top:1px solid var(--line)}

.tblwrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--data);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th.n,td.n{text-align:right}
td{padding:7px 6px;border-bottom:1px solid #22383d;white-space:nowrap}
td.n{font-family:var(--data);font-variant-numeric:tabular-nums;font-weight:600}
tr.me td{background:rgba(243,178,58,.08)}
tr.me td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
th.sort{cursor:pointer}
th.sort.on{color:var(--amber)}
.a90{color:#b8f5cc}.a80{color:var(--good)}.a70{color:var(--chalk)}.a60{color:#b9c6c3}.a0{color:var(--dim)}
.pos{display:inline-block;min-width:30px;text-align:center;font-family:var(--data);font-weight:700;font-size:12px;padding:2px 5px;border-radius:4px;background:var(--panel2);border:1px solid var(--line)}
.pos.GK{color:#f3d26b}.pos.CB,.pos.FB{color:#7cc4f0}.pos.CM,.pos.WM{color:#8fe0a4}.pos.ST{color:#f39a8b}
.ovr{display:inline-grid;place-items:center;min-width:32px;height:24px;border-radius:4px;font-family:var(--data);font-weight:700;background:var(--panel2)}
.inxi{color:var(--amber);font-weight:700}

.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input,.tools select,.slot select,.seg{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.tools input{min-width:0;flex:1 1 160px}
.seg{display:inline-flex;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:4px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--amber);color:var(--amber-ink)}

.lineup{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:640px){.lineup{grid-template-columns:1fr}}
.mini{position:relative;aspect-ratio:68/100;max-width:100%;border-radius:8px;overflow:hidden;
 background:repeating-linear-gradient(0deg,#2c7340 0 10%,#2a6b3c 10% 20%);border:2px solid #3f8a55}
.mini::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.45)}
.mini::after{content:"";position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;border:2px solid rgba(255,255,255,.45);border-radius:50%;transform:translate(-50%,-50%)}
.mini .box{position:absolute;left:22%;right:22%;bottom:0;height:15%;border:2px solid rgba(255,255,255,.45);border-bottom:0}
.mini .box.t{top:0;bottom:auto;border:2px solid rgba(255,255,255,.45);border-top:0}
.mini .pt{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:2px;z-index:1;width:76px}
.mini .pt .badge{width:28px;height:28px;font-size:13px;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.mini .pt span:not(.badge){font-size:11px;font-weight:600;background:rgba(10,20,20,.72);padding:0 4px;border-radius:3px;white-space:nowrap;max-width:76px;overflow:hidden;text-overflow:ellipsis}
.slots{display:grid;gap:6px}
.slot{display:grid;grid-template-columns:38px minmax(0,1fr) 40px;gap:8px;align-items:center}
.slot select{width:100%;padding:6px 8px}
.slot .r{text-align:right}

.note{color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--chalk);color:var(--night);padding:10px 16px;border-radius:8px;font-weight:600;z-index:50;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.4)}

/* ---- match ---- */
.match{max-width:1180px;margin:0 auto;padding-block:14px 40px;display:grid;gap:12px}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:#0a1213;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.board .tm{display:flex;align-items:center;gap:10px;min-width:0}
.board .tm.r{justify-content:flex-end}
.board .tm h3{font-size:clamp(16px,3vw,26px);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board .score{display:grid;justify-items:center}
.board .score b{font-family:var(--display);font-weight:900;font-size:clamp(34px,6vw,52px);line-height:.95;letter-spacing:.04em}
.board .clock{font-family:var(--data);font-weight:700;color:var(--amber);font-size:15px}
.pitchwrap{position:relative;width:fit-content;max-width:100%;margin-inline:auto;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#24683a}
.pitchwrap canvas{display:block;width:100%;margin:0 auto}
.board .abbr{display:none}
@media (max-width:600px){.board .full{display:none}.board .abbr{display:inline}}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.ctrl .g{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:760px){.mgrid{grid-template-columns:1fr}}
.feed{max-height:220px;overflow:auto;display:grid;align-content:start}
.feed div{display:grid;grid-template-columns:36px 10px minmax(0,1fr);gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #22383d;font-size:14px}
.feed .m{font-family:var(--data);font-weight:700;color:var(--muted);text-align:right}
.feed .dot{width:8px;height:8px;border-radius:50%}
.feed .goal{font-weight:700;color:var(--amber)}
.statrow{display:grid;grid-template-columns:44px 1fr 44px;gap:10px;align-items:center;padding:5px 0}
.statrow .lbl{grid-column:1/-1;text-align:center;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-family:var(--data);margin-bottom:-4px}
.statrow .bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line)}
.statrow .n{font-family:var(--data);font-weight:700}
.statrow .n.r{text-align:right}
.ftover{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,14,15,.72);padding:16px}
.ftcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;display:grid;gap:12px;justify-items:center;text-align:center;max-width:420px;width:100%}
.ftcard h2{font-size:44px;text-transform:uppercase}
.ftcard .res{font-family:var(--display);font-weight:900;font-size:56px;line-height:1}

/* ---- v2 additions ---- */
.pospills{display:flex;flex-wrap:wrap;gap:4px}.pospills button{border:1px solid #2c4a6e;background:#0f2238;border-radius:6px;padding:5px 8px;font-family:var(--data);font-weight:700;font-size:13px;color:#a9c6e4}
.pospills button.on{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.retn{display:block;font-size:11px;font-weight:600;color:#ef6a5b;font-family:var(--data)}.retn.soft{color:#f39a8b;font-weight:500}
.tcard .retn{color:#b42318;font-size:12px;margin-top:2px}
.ptile .tret{position:absolute;top:-6px;right:-6px;background:#d92d20;color:#fff;font-family:var(--data);font-weight:800;font-size:9px;padding:1px 3px;border-radius:3px}
.obody{display:grid;gap:3px}.obody .oname{font-size:15px}.obody .orank{display:flex;gap:6px;align-items:center}
.offer{display:grid;grid-template-columns:minmax(160px,auto) minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0}@media (max-width:640px){.offer{grid-template-columns:1fr}}
.ohead{display:flex;gap:10px;align-items:center}.ohead div{display:grid}.obody{display:grid;gap:3px;font-size:14px}.oact{display:flex;gap:6px}
.boostlist{display:grid;gap:8px}.boostrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.boostrow b{display:block}.boostrow small{color:var(--muted)}
.boostbadge{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:var(--amber);color:var(--amber-ink);font-family:var(--data);font-weight:700;font-size:12px}

.bdgedit{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start}@media (max-width:560px){.bdgedit{grid-template-columns:1fr}}
.bdgprev{display:grid;place-items:center;width:120px;height:120px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.bdgopts{display:grid;gap:10px}.bdgrow{display:flex;flex-wrap:wrap;gap:6px;align-items:end}
.bopt{display:grid;place-items:center;width:48px;height:48px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.bopt.on{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.cpick input{width:64px;height:36px;padding:2px;background:var(--panel2);border:1px solid var(--line);border-radius:6px}

.subhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.subcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media (max-width:640px){.subcols{grid-template-columns:1fr}}
.subcols h4{margin:4px 0 6px;font-family:var(--display);font-size:18px;text-transform:uppercase}
.rlist.subl li{padding:0;display:block;border-bottom:1px solid #22383d}
.subrow{width:100%;display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:8px;align-items:center;background:none;border:0;padding:6px 4px;text-align:left;border-radius:6px}
.subrow:hover:not(:disabled){background:rgba(255,255,255,.05)}.subrow:disabled{opacity:.55;cursor:default}
.subl li.sel .subrow{background:rgba(243,178,58,.16);outline:1px solid var(--amber)}
.ebar{display:inline-block;width:54px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}.ebar i{display:block;height:100%}
.ev{font-size:12px;color:var(--muted);min-width:32px;text-align:right}
.fld{display:grid;gap:6px}.fld span{font-size:13px;color:var(--muted)}.fld input{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
.balls{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.ballopt{display:grid;justify-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;font-weight:600}
.ballopt.on{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}.ballopt canvas{width:64px;height:64px}

.venuebar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.wx{display:inline-flex;align-items:center;gap:6px;font-family:var(--data);font-weight:600;font-size:13px;color:var(--chalk);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 6px}

.cupoffer{display:grid;gap:10px;border:1px solid #2c4a6e;background:linear-gradient(135deg,rgba(40,80,140,.25),rgba(12,26,43,.4));border-radius:10px;padding:14px;width:100%}
.cupoffer .eyebrow{color:#7fc8ff}
.cuphead{border-color:#2c4a6e;background:linear-gradient(160deg,#16314d 0%,var(--panel) 60%)}
.cgroups{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:8px}
.cgroup table{font-size:13px}.cgroup td,.cgroup th{padding:5px 4px}
.fixture .sc small{display:block;font-size:11px;color:var(--muted);font-family:var(--data)}

select{background:var(--panel2);color:var(--chalk);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
select option,select optgroup{background:#1b2021;color:#ecece8}
.htover{overflow:auto;align-items:start}
.htcard{max-width:760px;justify-items:stretch;text-align:left}
.htcard>.eyebrow,.htcard>.res,.htcard>h2,.htcard>.note{justify-self:center;text-align:center}
.htcard>.btn{justify-self:center}
.motm{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;background:rgba(243,178,58,.12);border:1px solid var(--amber);border-radius:10px;padding:10px 14px}
.motm .eyebrow{grid-column:1/-1;color:var(--amber)}
.motm b{font-family:var(--display);font-size:24px;text-transform:uppercase}
.motm span:not(.eyebrow):not(.rchip){color:var(--muted);font-size:13px;grid-column:1}
.motm .rchip{grid-row:2/4;grid-column:2}
.rcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:600px){.rcols{grid-template-columns:1fr}}
.rcols h4{margin:0 0 6px;font-family:var(--display);font-size:18px;text-transform:uppercase}
.rlist{list-style:none;margin:0;padding:0;display:grid}
.rlist li{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #22383d}
.rn{display:grid;font-weight:600;font-size:14px;min-width:0}.rn small{font-weight:400;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.rchip{display:inline-grid;place-items:center;min-width:32px;height:24px;padding:0 5px;border-radius:5px;font-family:var(--data);font-weight:700;font-variant-numeric:tabular-nums;vertical-align:middle}
.rchip.sm{min-width:30px;height:22px;font-size:14px}
.rchip.lg{min-width:46px;height:34px;font-size:20px;border-radius:6px}
.rchip.gold{box-shadow:0 0 0 2px #e3b341}
.ladder{list-style:none;display:flex;flex-wrap:wrap;gap:6px;padding:0;margin:6px 0 0}
.ladder li{display:grid;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-width:150px}
.ladder li b{font-family:var(--display);font-size:18px;text-transform:uppercase}
.ladder li span{font-size:12px;color:var(--muted)}
.ladder li.on{border-color:var(--amber)}
.ladder li+li{position:relative}
.venue{height:120px;border-radius:8px;background-size:cover;background-position:center;margin:0 0 16px;border:1px solid var(--line)}
.news ul{margin:8px 0 10px;padding-left:18px;display:grid;gap:4px}
.tacs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 4px}
.tacs button{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:7px 14px;font-weight:600;color:var(--muted)}
.tacs button.on{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.tacdesc{margin:2px 0 12px}
.swapbar{background:rgba(243,178,58,.14);border:1px solid var(--amber);border-radius:8px;padding:8px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.squadfield{display:grid;grid-template-columns:auto minmax(0,auto);gap:16px;align-items:start;justify-content:center}

  for(const side of [0,1]){const gx=side?PL:0,d=side?1:-1;
   const u=(pl.x-gx)*d,v=pl.y;const y0=GY-GW/2,y1=GY+GW/2;
   // nets: nobody stands behind the goal line inside the goal frame
   if(u>0&&u<ND+rad&&v>y0-rad&&v<y1+rad){
    const pen=[[u+0.05,'f'],[ND+rad-u,'b'],[v-(y0-rad),'l'],[(y1+rad)-v,'r']].sort((a,c)=>a[0]-c[0])[0];

function doSwap(a,b){
 const me=myTeam();const ia=me.xi.indexOf(a),ib=me.xi.indexOf(b);
 if(ia>=0&&ib>=0){me.xi[ia]=b;me.xi[ib]=a;}
 else if(ia>=0){me.xi[ia]=b;}
 else if(ib>=0){me.xi[ib]=a;}
 else return toast('Both players are on the bench.');
 const pa=playerById(a),pb=playerById(b);if(pa&&pb)toast(`${surname(pa.name)} ⇄ ${surname(pb.name)}`);
}

 </div>`;
 document.body.appendChild(layer);

 list.sort((a,b)=>{const x=key(a),y=key(b);return (x<y?-1:x>y?1:0)*F.dir||b.p.ovr-a.p.ovr;});

// ---------- stadium sound: crowd bed, chants, roars, whistles (all synthesised, no audio files) ----------
const SND={ctx:null,master:null,bed:null,bedG:null,chantT:0,on:false,disabled:true};
function sndNoise(sec){const c=SND.ctx;const b=c.createBuffer(1,c.sampleRate*sec,c.sampleRate);const d=b.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;l=(l+0.02*w)/1.02;d[i]=l*3.2+w*0.12;}return b;}
function sndStart(){
 if(SND.disabled)return;
 try{if(!SND.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;SND.ctx=new AC();SND.master=SND.ctx.createGain();SND.master.connect(SND.ctx.destination);SND.noise=sndNoise(4);}
  const c=SND.ctx;if(c.state==='suspended')c.resume();SND.master.gain.value=SND.on?0.9:0;
  if(SND.bed)return;
  const src=c.createBufferSource();src.buffer=SND.noise;src.loop=true;
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;const bp=c.createBiquadFilter();bp.type='peaking';bp.frequency.value=450;bp.gain.value=6;
  const g=c.createGain();g.gain.value=0.16;const lfo=c.createOscillator();lfo.frequency.value=0.13;const lg=c.createGain();lg.gain.value=0.05;lfo.connect(lg);lg.connect(g.gain);lfo.start();
  src.connect(lp);lp.connect(bp);bp.connect(g);g.connect(SND.master);src.start();SND.bed=src;SND.bedG=g;SND.lfo=lfo;SND.chantT=performance.now()+8000+Math.random()*8000;
 }catch(e){}
}
function sndStop(){try{if(SND.bed){const g=SND.bedG,c=SND.ctx;g.gain.cancelScheduledValues(c.currentTime);g.gain.setTargetAtTime(0,c.currentTime,0.4);const s=SND.bed,l=SND.lfo;setTimeout(()=>{try{s.stop();l.stop();}catch(e){}},1500);SND.bed=null;}}catch(e){}}
function sndPause(p){try{if(!SND.ctx)return;if(p)SND.ctx.suspend();else SND.ctx.resume();}catch(e){}}
function sndToggle(){SND.on=!SND.on;try{localStorage.setItem('um-sound',SND.on?'on':'off');}catch(e){}if(SND.master)SND.master.gain.setTargetAtTime(SND.on?0.9:0,SND.ctx.currentTime,0.05);}
// a swell of crowd noise: roars, cheers, groans
function sndSwell(peak,dur,f0,f1,att){const c=SND.ctx;if(!c||!SND.on)return;const t=c.currentTime;
 const src=c.createBufferSource();src.buffer=SND.noise;const bp=c.createBiquadFilter();bp.type='bandpass';bp.Q.value=0.7;bp.frequency.setValueAtTime(f0,t);bp.frequency.linearRampToValueAtTime(f1,t+att+0.3);bp.frequency.linearRampToValueAtTime(f0,t+dur);
 const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+att);g.gain.setTargetAtTime(0.0001,t+att+dur*0.35,dur*0.3);
 src.connect(bp);bp.connect(g);g.connect(SND.master);src.start(t,Math.random()*2);src.stop(t+dur+1.5);}
function sndVoices(notes,beat,vol){const c=SND.ctx;if(!c||!SND.on)return;let t=c.currentTime+0.05;
 const out=c.createGain();out.gain.value=vol;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1300;out.connect(lp);lp.connect(SND.master);
 for(const [f,len] of notes){if(f)for(let v=0;v<7;v++){const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f*(1+(Math.random()-0.5)*0.025);const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.09,t+0.06);g.gain.setValueAtTime(0.09,t+len*beat*0.75);g.gain.exponentialRampToValueAtTime(0.0001,t+len*beat*0.98);
   const vib=c.createOscillator();vib.frequency.value=5+Math.random()*2;const vg=c.createGain();vg.gain.value=f*0.012;vib.connect(vg);vg.connect(o.frequency);vib.start(t);vib.stop(t+len*beat);o.connect(g);g.connect(out);o.start(t);o.stop(t+len*beat);}
  t+=len*beat;}
}
function sndClaps(n,gap,vol){const c=SND.ctx;if(!c||!SND.on)return;for(let i=0;i<n;i++){const t=c.currentTime+0.05+i*gap;const s=c.createBufferSource();s.buffer=SND.noise;const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=1200;const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.12);s.connect(hp);hp.connect(g);g.connect(SND.master);s.start(t,Math.random()*3);s.stop(t+0.15);}}
function sndChant(){const r=Math.random();
 if(r<0.4)sndVoices([[392,1],[330,1],[392,1],[330,1],[392,1],[440,1],[392,2]],0.32,0.5);          // "o-lé, o-lé, o-lé…"
 else if(r<0.75){sndVoices([[294,1.5],[0,0.5],[294,1.5],[0,0.5],[330,1],[294,1],[262,2]],0.3,0.45);sndClaps(6,0.6,0.25);} // clap and sing
 else sndClaps(9,0.42,0.3);}                                                                      // rhythmic clapping
function sndWhistle(n){const c=SND.ctx;if(!c||!SND.on)return;let t=c.currentTime+0.02;
 for(let i=0;i<n;i++){const len=i===n-1?0.9:0.3;const o=c.createOscillator();o.type='sine';o.frequency.value=2900;const tr=c.createOscillator();tr.frequency.value=32;const tg=c.createGain();tg.gain.value=120;tr.connect(tg);tg.connect(o.frequency);
  const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.18,t+0.02);g.gain.setValueAtTime(0.18,t+len-0.05);g.gain.exponentialRampToValueAtTime(0.0001,t+len);o.connect(g);g.connect(SND.master);o.start(t);tr.start(t);o.stop(t+len);tr.stop(t+len);t+=len+0.12;}}

// ---------- transfer offers & swap proposals ----------
function makeOffers(){
 const me=myTeam();const T=T_();S.offers=S.offers||[];const n=1+Math.floor(Math.random()*3);
 const mine=me.squad.slice().sort((a,b)=>b.ovr-a.ovr).slice(0,Math.max(6,Math.floor(me.squad.length*0.6)));
 for(let k=0;k<n;k++){
  const p=mine[Math.floor(Math.random()*mine.length)];if(!p||S.offers.some(o=>o.pid===p.id))continue;
  const clubs=T.map((t,i)=>[t,i]).filter(([t,i])=>i!==S.me&&t.squad.length<24&&Math.abs(t.league-me.league)<=2&&LEAGUE_CAP[t.league]>=p.ovr);
  if(!clubs.length)break;const [club,ci]=clubs[Math.floor(Math.random()*clubs.length)];
  const fee=Math.round(p.value*(0.75+Math.random()*0.65)/5000)*5000;
  const o={id:S.nextId++,club:ci,pid:p.id,exp:S.done?3:S.round+3,carry:!!S.done};
  if(Math.random()<0.4){
   const cand=club.squad.filter(q=>Math.abs(q.ovr-p.ovr)<=8&&q.age<33&&q.ovr<=LEAGUE_CAP[me.league]+10).sort(()=>Math.random()-0.5)[0];
   if(cand){o.kind='swap';o.swapPid=cand.id;o.cash=Math.round(Math.max(0,(p.value-cand.value)*(0.6+Math.random()*0.5))/5000)*5000;if(o.cash>club.budget)o.cash=Math.floor(club.budget/5000)*5000;S.offers.push(o);continue;}
  }
  if(club.budget<fee)continue;o.kind='bid';o.fee=fee;S.offers.push(o);
 }
 if(S.offers.length)S.news=(S.news||[]).concat(`You have ${S.offers.length} transfer offer${S.offers.length>1?'s':''} to look at.`);
}
function offersHTML(){
 const T=T_();const me=myTeam();
 // drop any offer whose player (or swap player) has since moved on, so nothing shows up half-empty
 const offs=(S.offers||[]).filter(o=>findP(me,o.pid)&&T[o.club]&&(o.kind!=='swap'||findP(T[o.club],o.swapPid)));
 if(!offs.length)return '';
 return `<section class="panel offers"><span class="eyebrow">Transfer offers</span><div class="list">${offs.map(o=>{const p=findP(me,o.pid);const c=T[o.club];const sp=o.kind==='swap'?findP(c,o.swapPid):null;

  return `<div class="offer"><div class="ohead">${badge(c,30)}<div><b>${esc(c.name)}</b><span class="note">${LEAGUES[c.league].name}${sp?' · swap deal':''}</span></div></div>
  <div class="obody"><b class="oname">${esc(p.name)}</b><span class="orank">${chip(p.ovr,'sm')} <span class="pos ${CAT[p.pos]}">${p.pos}</span></span>${sp?`<span class="note">Your valuation ${fmt(p.value)}</span><span class="note">${offer}</span>`:`<span class="note">Your valuation ${fmt(p.value)} · ${offer}</span>`}</div>
  <div class="oact"><button class="btn sm primary" data-oacc="${o.id}">Accept</button><button class="btn sm ghost" data-orej="${o.id}">Reject</button></div></div>`;}).join('')}</div></section>`;
}

function acceptOffer(id){
 const T=T_();const me=myTeam();const o=(S.offers||[]).find(x=>x.id===id);if(!o)return;const c=T[o.club];const p=findP(me,o.pid);
 if(!p||!c){S.offers=S.offers.filter(x=>x!==o);return;}
 if(o.kind==='bid'){if(me.squad.length<=14){toast('You need at least 14 players in your squad.');return;}
  me.squad=me.squad.filter(q=>q!==p);c.squad.push(p);c.budget-=o.fee;me.budget+=o.fee;p.num=0;numberSquad(c);c.xi=autoPick(c.squad,c.formation);toast(`${p.name} sold to ${c.name} for ${fmt(o.fee)}`);}
 else{const sp=findP(c,o.swapPid);if(!sp){S.offers=S.offers.filter(x=>x!==o);return;}
  me.squad=me.squad.filter(q=>q!==p);c.squad=c.squad.filter(q=>q!==sp);me.squad.push(sp);c.squad.push(p);p.num=0;sp.num=0;numberSquad(me);numberSquad(c);
  me.budget+=o.cash||0;c.budget-=o.cash||0;c.xi=autoPick(c.squad,c.formation);toast(`Swap done: ${sp.name} joins${o.cash?` with ${fmt(o.cash)}`:''}`);}
 S.offers=S.offers.filter(x=>x.pid!==o.pid&&x.swapPid!==o.swapPid);fixXI(me);save();renderHub();
}

// ---------- Cups: European Cup, World Cup and the Eternal Cup ----------
const STAGES=['groups','r16','qf','sf','final','done'];
const STAGE_NAME={groups:'Group stage',r16:'Last 16',qf:'Quarter-finals',sf:'Semi-finals',final:'Final',done:'Finished'};
const CUP_KIND={euro:{name:'European Cup',champs:'European champions'},world:{name:'World Cup',champs:'World champions'},mystery:{name:'The Eternal Cup',champs:'Eternal champions'}};
const WORLD_PRIZE=Object.fromEntries(Object.entries(CUP_PRIZE).map(([k,v])=>[k,v*2]));
const ETERNAL_PRIZE={part:0,win:0,draw:0,r16:0,qf:0,sf:5e6,runner:0,champ:25e6};
function cupKind(){return (S.cup&&S.cup.kind)||'euro';}
function cupName(){return CUP_KIND[cupKind()].name;}
function cupPrize(k){k=k||cupKind();return k==='world'?WORLD_PRIZE:k==='mystery'?ETERNAL_PRIZE:CUP_PRIZE;}
function cupT(cid){return cid[0]==='w'?S.world.teams[+cid.slice(1)]:S.cup.euro[+cid.slice(1)];}
function myCid(){return 'w'+S.me;}
function qualifiedForCup(){return myLg()<=3&&table(myLg()).slice(0,4).some(r=>r.i===S.me);}
function wonPL(){return myLg()===0&&table(0)[0].i===S.me;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function payCup(cid,amt){if(!amt||cid[0]!=='w')return;cupT(cid).budget+=amt;if(cid===myCid())S.cup.earn+=amt;}

  h.p++;a.p++;h.gf+=f.hs;h.ga+=f.as;a.gf+=f.as;a.ga+=f.hs;

 const pH=clamp(0.75+(sk(H)-gk(A))/300,0.55,0.92),pA=clamp(0.75+(sk(A)-gk(H))/300,0.55,0.92);

 });

 }

 c.ko[next]=[];for(let i=0;i<winners.length;i+=2)c.ko[next].push({h:winners[i],a:winners[i+1],hs:null,as:null});

   <div class="authlogo">Ultimate <span>Manager</span></div><h2>Create user</h2>
   ${msg?`<p class="umsg">${esc(msg)}</p>`:''}
   <input id="uname" maxlength="20" placeholder="Name" aria-label="Name" autocomplete="username" required>
   <input type="password" id="upw1" placeholder="Password" aria-label="Password" autocomplete="new-password" required>
   <input type="password" id="upw2" placeholder="Repeat password" aria-label="Repeat password" autocomplete="new-password" required>
   <button class="btn primary" type="submit">Create user</button>
   ${legacy&&!users.length?`<p class="note">Your existing career on this device will move into this user.</p>`:''}
   ${users.length?`<button class="linkbtn" type="button" id="uback">Back to players</button>`:''}</form></div>`;
  setTimeout(()=>$('#uname')?.focus(),30);
  const bk=$('#uback');if(bk)bk.onclick=()=>{L.mode='pick';renderLogin();};
  $('#unf').onsubmit=async e=>{e.preventDefault();const name=$('#uname').value.trim(),p1=$('#upw1').value,p2=$('#upw2').value;
   if(!name)return renderLogin('Enter a name.');if(p1.length<4)return renderLogin('Use a password of at least 4 characters.');if(p1!==p2)return renderLogin('The passwords do not match.');
   const all=getUsers();if(all.some(u=>u.name.toLowerCase()===name.toLowerCase()))return renderLogin('There is already a user called '+name+'.');
   const salt=Math.random().toString(36).slice(2)+Date.now().toString(36);
   const u={id:'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,salt,hash:await hashPw(p1,salt),av:makeAvatar(),created:Date.now()};
   if(!all.length){try{const old=localStorage.getItem(LEGACY_KEY);if(old){localStorage.setItem('um-save::'+u.id,old);localStorage.removeItem(LEGACY_KEY);}}catch(e){}}
   all.push(u);setUsers(all);L.mode='pick';L.fresh=u.id;renderLogin();};
  return;
 }
 // pick a player: tap a picture to go straight in
 app.innerHTML=`<div class="authwrap"><div class="authpick">
  <div class="authlogo">Ultimate <span>Manager</span></div><h2>${L.remove?'Remove a user':"Who's playing?"}</h2>
  ${msg?`<p class="umsg">${esc(msg)}</p>`:''}
  <div class="avrow">${users.map(u=>`<button class="avbtn ${L.fresh===u.id?'fresh':''} ${L.remove===u.id?'on':''}" data-upick="${u.id}">${userPic(u,104)}<b>${esc(u.name)}</b><span>${esc(saveSummary(u))}</span></button>`).join('')}
   ${L.remove?'':`<button class="avbtn add" id="unew"><span class="plus">+</span><b>New user</b><span>Create a profile</span></button>`}</div>
  ${L.remove&&L.remove!==true?`<form class="authcard small" id="udelf"><input type="password" id="udpw" placeholder="Password for ${esc(users.find(u=>u.id===L.remove)?.name||'')}" aria-label="Password"><button class="btn" type="submit">Delete user and career</button></form>`:''}
  <button class="linkbtn" id="uremove">${L.remove?'Done':'Remove a user'}</button></div></div>`;
 app.querySelectorAll('[data-upick]').forEach(b=>b.onclick=()=>{const u=getUsers().find(x=>x.id===b.dataset.upick);if(!u)return;
  if(L.remove){L.remove=u.id;renderLogin();setTimeout(()=>$('#udpw')?.focus(),30);return;}enterAs(u);});
 const nb=$('#unew');if(nb)nb.onclick=()=>{L.mode='new';renderLogin();};
 $('#uremove').onclick=()=>{L.remove=L.remove?null:true;renderLogin();};
 const df=$('#udelf');if(df)df.onsubmit=async e=>{e.preventDefault();const u=getUsers().find(x=>x.id===L.remove);if(!u)return;
  if(await hashPw($('#udpw').value,u.salt)!==u.hash)return renderLogin('That password is not right.');
  setUsers(getUsers().filter(x=>x.id!==u.id));try{localStorage.removeItem('um-save::'+u.id);}catch(e){}L.remove=null;if(!getUsers().length)L.mode='new';renderLogin(u.name+' has been removed.');};
}
// ---------- boot ----------
function startSession(){
S=load();
if(S&&S.world.teams.length===32){
 // older saves: add the new National League and Non-League divisions below Division 2
 const savePID=PID;PID=S.nextId+1000;const r=mkRng(99173);const used=new Set();S.world.teams.forEach(t=>t.squad.forEach(p=>used.add(p.name)));
 const gen=(d,tier)=>SQUAD_SHAPE.map((pos,i)=>makePlayer(r,pos,tier+(i<11?2:-3)+gaussR(r)*2.5,used));
 const add=(d,l,tier)=>{const t=makeClub(d,l,gen(d,tier));t.pitch=[0,2,4][S.world.teams.length%3];numberSquad(t);t.xi=autoPick(t.squad,t.formation);S.world.teams.push(t);};
 D2_DEF.forEach(d=>add(d,5,d.tier-9));NL_DEF.forEach(d=>add(d,4,d.tier));
 S.nextId=PID+10;PID=savePID;
 for(let l=4;l<NL;l++){const ids=leagueTeams(l);S.fx[l]=fixtures(ids.length).map(rd=>rd.map(f=>({h:ids[f.h],a:ids[f.a],hs:null,as:null})));
  for(let rd=0;rd<Math.min(S.round,S.fx[l].length);rd++)for(const f of S.fx[l][rd]){const q=quickSim(T_()[f.h],T_()[f.a]);f.hs=q.hs;f.as=q.as;f.sc=[];}}
 save();
}
if(S&&S.fx.length===7){
 // older saves had separate National League North and South: merge into one National League N/S
 const T=S.world.teams;const ml=T[S.me].league;const keep=ml===4||ml===5?ml:4,drop=keep===4?5:4;
 const gone=T.map((t,i)=>i).filter(i=>T[i].league===drop);
 const freed=gone.flatMap(i=>T[i].squad).sort((a,b)=>b.ovr-a.ovr).slice(0,40);freed.forEach(p=>{p.num=0;S.world.free.push(p);});
 const map={};let n=0;T.forEach((t,i)=>{if(!gone.includes(i))map[i]=n++;});
 S.world.teams=T.filter((t,i)=>!gone.includes(i));
 S.world.teams.forEach(t=>{if(t.league===keep)t.league=4;else if(t.league===6)t.league=5;});
 const rf=f=>{f.h=map[f.h];f.a=map[f.a];};
 S.fx=[S.fx[0],S.fx[1],S.fx[2],S.fx[3],S.fx[keep],S.fx[6]];S.fx.forEach(lg=>lg.forEach(rd=>rd.forEach(rf)));
 S.me=map[S.me];
 S.offers=(S.offers||[]).filter(o=>map[o.club]!=null).map(o=>({...o,club:map[o.club]}));
 if(S.cup){const rc=x=>x&&x[0]==='w'?'w'+map[+x.slice(1)]:x;const c=S.cup;c.groups=(c.groups||[]).map(g=>g.map(rc));(c.gfx||[]).forEach(md=>md.forEach(f=>{f.h=rc(f.h);f.a=rc(f.a);}));Object.values(c.ko||{}).forEach(r=>r.forEach(f=>{f.h=rc(f.h);f.a=rc(f.a);}));if(c.winner)c.winner=rc(c.winner);}
 save();
}
if(S&&!S.capFix){S.world.teams.forEach(t=>t.squad.forEach(refresh));S.world.free.forEach(refresh);S.world.teams.forEach(fixXI);S.capFix=1;save();}
if(S&&!S.trait2){[...S.world.teams.flatMap(t=>t.squad),...S.world.free].forEach(p=>{if(!TRAIT_OF[p.name]){delete p.trait;}});S.trait2=1;save();}
if(S&&!S.balls){const ml=S.world.teams[S.me].league;S.balls=['white','orange'];for(let l=4;l>=0;l--)if(l>=ml)S.balls.push(BALL_FOR_LG[l]);save();}
if(S&&!S.real2){
 // real players: back to exactly how they started, nobody has retired, and the full current squads are on the books
 const _pid=PID;const ref=newWorld(20261011);PID=_pid;const byName={};ref.teams.forEach(t=>t.squad.forEach(p=>{if(p.real)byName[p.name]={p,club:t.id};}));
 const have=new Set();const all=[...S.world.teams.flatMap(t=>t.squad),...S.world.free];
 for(const p of all){const r=byName[p.name];if(!p.real||!r)continue;have.add(p.name);for(const a of ATTRS)p[a]=r.p[a];p.age=r.p.age;p.ageM=0;p.retiring=false;delete p.retAge;refresh(p);}
 for(const [name,r] of Object.entries(byName)){if(have.has(name))continue;const t=S.world.teams.find(x=>x.id===r.club);const np=JSON.parse(JSON.stringify(r.p));np.id=S.nextId++;np.num=0;np.goals=0;np.apps=0;
  if(t){t.squad.push(np);numberSquad(t);}else S.world.free.push(np);}
 S.world.teams.forEach((t,i)=>{if(i!==S.me)t.xi=autoPick(t.squad,t.formation);});
 S.real2=1;save();
}
if(S&&!S.ret2){const all=[...S.world.teams.flatMap(t=>t.squad),...S.world.free];for(const p of all){p.ageM=p.ageM||0;p.retAge=Math.max(retAgeFor(p),p.age+1);p.retiring=false;}S.ret2=1;save();}
if(S&&!S.lgCap){relocateStars();S.lgCap=1;save();}
if(S){S.world.teams.forEach(t=>t.squad.forEach(p=>{if(p.pos==='DM'){p.pos='CM';refresh(p);}}));S.world.free.forEach(p=>{if(p.pos==='DM'){p.pos='CM';refresh(p);}});}
if(S){const mig=p=>{const r=Math.random();
  if(p.pos==='FB')p.pos=r<0.5?'LB':'RB';else if(p.pos==='WM')p.pos=['LM','RM','LW','RW'][Math.floor(r*4)];else if(p.pos==='ST')p.pos='CF';
  else if(p.pos==='CM'&&!p.mig){p.pos=p.sho>p.tck+14?'AM':'CM';}
  p.mig=1;if(!S.posMig)refresh(p);};
 if(!S.posMig){for(const t of S.world.teams){t.squad.forEach(mig);if(!FORMATIONS[t.formation])t.formation='4-4-2';}S.world.free.forEach(mig);S.posMig=1;}
 for(const t of S.world.teams){if(TACTICS[t.tactic]==null)t.tactic='balanced';}
 const addStr=p=>{if(p.str==null){p.str=Math.round(clamp(62+(PROFILE[p.pos].str||0)+(Math.random()-0.5)*16,30,95));refresh(p);}};for(const t of S.world.teams)t.squad.forEach(addStr);S.world.free.forEach(addStr);
 if(!S.strFix){
  // rebuild strength: real players from their reference data, everyone else in line with their quality
  const ref={};const _pid=PID;newWorld(20261011).teams.forEach(t=>t.squad.forEach(p=>{if(p.real)ref[p.name]=p.str;}));PID=_pid;
  const fix=p=>{if(p.real&&ref[p.name]!=null)p.str=ref[p.name];else p.str=strFor(p.ovr-2,p.pos,(Math.random()-0.5)*2);refresh(p);};
  for(const t of S.world.teams)t.squad.forEach(fix);S.world.free.forEach(fix);S.strFix=1;save();
 }
 for(const t of S.world.teams){fixXI(t);if(t.id==='rmr'&&!t.kitSet){t.c1='#161616';t.c2='#d32a24';}}}
render();
}
initAuth();
</script>
